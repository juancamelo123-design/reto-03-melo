<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente de Órdenes de Compra</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --accent:#1f5eff; --ok:#12805c; --err:#c0362c; --warn:#b54708; --warnbg:#fff6e5; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  #estado { font-size:12px; color:var(--muted); }
  .casos { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  .casos button { font-size:12px; padding:4px 10px; border:1px solid var(--line); background:#fff; border-radius:999px; cursor:pointer; }
  .casos button:hover { border-color:var(--accent); color:var(--accent); }
  main { flex:1; overflow-y:auto; padding:20px; }
  .msg { max-width:860px; margin:0 auto 14px; padding:12px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--line); }
  .msg.user { background:#eef3ff; border-color:#d6e2ff; }
  .msg.confirm { border:2px solid var(--warn); background:var(--warnbg); }
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--warn); color:#fff; margin-bottom:8px; }
  .rol { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px; }
  .msg table { border-collapse:collapse; margin:8px 0; font-size:13px; display:block; overflow-x:auto; }
  .msg th,.msg td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  .tools { margin:4px 0 10px; display:flex; flex-direction:column; gap:4px; }
  details.tool { font-size:12px; border:1px solid var(--line); border-radius:8px; padding:4px 10px; background:#fafbfc; }
  details.tool summary { cursor:pointer; font-family:ui-monospace,Menlo,monospace; }
  details.tool .ok { color:var(--ok); } details.tool .err { color:var(--err); }
  details.tool pre { white-space:pre-wrap; word-break:break-word; margin:6px 0; }
  .acciones { margin-top:10px; display:flex; gap:8px; }
  .acciones button { padding:6px 14px; border-radius:8px; border:1px solid var(--warn); cursor:pointer; font-weight:600; }
  .acciones .si { background:var(--warn); color:#fff; } .acciones .no { background:#fff; color:var(--warn); }
  form { display:flex; gap:8px; padding:12px 20px; background:var(--panel); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:46px; padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  form button { padding:0 20px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }
  .pensando { max-width:860px; margin:0 auto; color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>🧾 Agente de Órdenes de Compra</h1>
  <span id="estado">conectando…</span>
  <div class="casos" id="casos"></div>
</header>
<main id="chat"></main>
<form id="form">
  <textarea id="entrada" placeholder='Ej.: Procesa la solicitud "sol-004" y no la crees hasta que yo lo confirme.'></textarea>
  <button id="enviar">Enviar</button>
</form>
<script>
const chat = document.getElementById("chat"), form = document.getElementById("form"), entrada = document.getElementById("entrada"), boton = document.getElementById("enviar")
let sessionId = null
const md = (t) => DOMPurify.sanitize(marked.parse(t || ""))
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])

fetch("/api/health").then(r => r.json()).then(h => { document.getElementById("estado").textContent = `modelo: ${h.provider} · ${h.model ?? "sin clave"}` }).catch(() => {})

for (const c of ["sol-001","sol-002","sol-003","sol-004","sol-005","sol-006"]) {
  const b = document.createElement("button"); b.textContent = c
  b.onclick = () => enviar(`Procesa la solicitud "${c}". Muéstrame la OC como quedaría en SAP y qué validaciones pasó.`)
  document.getElementById("casos").appendChild(b)
}

function agregar(rol, texto, toolCalls = [], confirmacion = false) {
  const div = document.createElement("div")
  div.className = `msg ${rol}${confirmacion ? " confirm" : ""}`
  let html = `<div class="rol">${rol === "user" ? "Analista" : "Agente"}</div>`
  if (confirmacion) html += `<span class="badge">⚠️ Requiere tu confirmación</span>`
  if (toolCalls.length) {
    html += `<div class="tools">` + toolCalls.map(t => `<details class="tool"><summary><span class="${t.ok ? "ok" : "err"}">${t.ok ? "✔" : "✖"}</span> ${esc(t.name)} — ${esc(t.resumen)}</summary><pre>args: ${esc(JSON.stringify(t.args, null, 2))}</pre></details>`).join("") + `</div>`
  }
  html += rol === "user" ? `<div>${esc(texto)}</div>` : md(texto)
  div.innerHTML = html
  if (confirmacion) {
    const acc = document.createElement("div"); acc.className = "acciones"
    acc.innerHTML = `<button class="si">Confirmo</button><button class="no">No crear</button>`
    acc.querySelector(".si").onclick = () => enviar("Confirmo")
    acc.querySelector(".no").onclick = () => enviar("No, no la crees. Déjala pendiente.")
    div.appendChild(acc)
  }
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight
}

async function enviar(texto) {
  if (!texto.trim() || boton.disabled) return
  document.querySelectorAll(".acciones").forEach(a => a.remove())
  agregar("user", texto); entrada.value = ""; boton.disabled = true
  const p = document.createElement("div"); p.className = "pensando"; p.textContent = "El agente está pensando…"; chat.appendChild(p)
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sessionId, message: texto }) })
    const d = await r.json()
    if (!r.ok) agregar("assistant", `⚠️ ${d.error ?? "Error del servidor"}`)
    else { sessionId = d.sessionId; agregar("assistant", d.reply, d.toolCalls, d.needsConfirmation) }
  } catch (e) { agregar("assistant", "⚠️ No pude contactar al servidor. Revisa tu conexión e intenta de nuevo.") }
  finally { p.remove(); boton.disabled = false; entrada.focus() }
}

form.onsubmit = (e) => { e.preventDefault(); enviar(entrada.value) }
entrada.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(entrada.value) } }
</script>
</body>
</html>
